<nav
  class="fixed top-0 left-0 right-0 bg-gray-900 text-gray-200 border-t border-gray-800 z-40"
>
  <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Brand + desktop links -->
      <div class="flex items-center gap-4">
        <!-- brand color adjusted to match footer -->
        <a routerLink="/" class="text-xl font-bold text-white"
          >Dental Service Appointment</a
        >

        <div class="hidden md:flex items-center space-x-4">
          <a
            routerLink="/"
            routerLinkActive="text-white font-semibold"
            class="text-gray-300 hover:text-white transition"
            >Home</a
          >
        </div>
      </div>

      <!-- Right side (profile / auth) + mobile toggle -->
      <div class="flex items-center gap-3">
        <!-- desktop profile / auth -->
        <div class="hidden md:flex items-center space-x-3">
          @if(currentUser) {
          <a
            routerLink="/profile"
            routerLinkActive="text-white"
            class="inline-flex items-center text-gray-300 hover:text-white transition"
            aria-label="Profile"
          >
            <app-user-icon></app-user-icon>
            My Profile
          </a>
          <button
            (click)="logout()"
            class="text-gray-300 hover:text-white transition"
          >
            Logout
          </button>
          } @else {
          <a
            routerLink="/register"
            class="text-gray-300 hover:text-white transition"
            >Register</a
          >
          <a
            routerLink="/login"
            class="text-gray-300 hover:text-white transition"
            >Login</a
          >
          }
        </div>

        <!-- mobile menu toggle -->
                 <label
          for="nav-toggle"
          class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </label>
        <input id="nav-toggle" type="checkbox" class="peer hidden" />

      </div>
    </div>

    <!-- mobile menu (uses peer to toggle) -->
    <div class="peer-checked:block md:hidden hidden">
      <!-- <input id="nav-toggle" type="checkbox" class="peer hidden" /> -->
      <div class="pt-4 pb-4 space-y-2">
        <a
          routerLink="/"
          routerLinkActive="text-white font-semibold"
          class="block px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded"
          >Home</a
        >

        @if(currentUser) {
        <a
          routerLink="/profile"
          class="px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded inline-flex items-center gap-2"
        >
          <app-user-icon></app-user-icon>
          My Profile
        </a>
        <button
          class="block px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded"
          (click)="logout()"
        >
          Logout
        </button>
        } @else {
        <a
          routerLink="/register"
          class="block px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded"
          >Register</a
        >
        <a
          routerLink="/login"
          class="block px-3 py-2 text-gray-300 hover:bg-gray-800 hover:text-white rounded"
          >Login</a
        >
        }
      </div>
    </div>
  </div>
</nav>
